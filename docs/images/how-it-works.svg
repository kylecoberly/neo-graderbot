<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6f6a62"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2e7d4f"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a6116"/>
    </marker>
  </defs>
  <rect width="1100" height="480" fill="#f4f1ea" rx="12"/>
  <text x="40" y="40" font-size="12" font-weight="600" letter-spacing="1.5" fill="#a39d93">ONE LANGGRAPH GRAPH · FOUR NODES · ONE MODEL CALL · TWO TOOLS THE MODEL NEVER HOLDS</text>

  <!-- input -->
  <g transform="translate(40,90)">
    <rect width="110" height="70" rx="8" fill="#fffdf9" stroke="#e4dfd5"/>
    <text x="55" y="30" text-anchor="middle" font-weight="600">learner's</text>
    <text x="55" y="50" text-anchor="middle" font-weight="600">answer</text>
  </g>
  <path d="M150 125 L186 125" stroke="#6f6a62" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- guard -->
  <g transform="translate(188,70)">
    <rect width="180" height="110" rx="8" fill="#fffdf9" stroke="#1f1d1a" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-weight="700">guard</text>
    <text x="90" y="44" text-anchor="middle" font-size="12" fill="#6f6a62">plain code, no model</text>
    <text x="14" y="68" font-size="12">empty · too long</text>
    <text x="14" y="86" font-size="12">contact details</text>
    <text x="14" y="104" font-size="12">instructions aimed at the grader</text>
  </g>
  <path d="M368 125 L404 125" stroke="#6f6a62" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- retrieve -->
  <g transform="translate(406,70)">
    <rect width="180" height="110" rx="8" fill="#fffdf9" stroke="#1f1d1a" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-weight="700">retrieve</text>
    <text x="90" y="44" text-anchor="middle" font-size="12" fill="#6f6a62">BM25, no model</text>
    <text x="14" y="68" font-size="12">the 3 passages of the lesson</text>
    <text x="14" y="86" font-size="12">that bear on the question</text>
  </g>
  <path d="M586 125 L622 125" stroke="#6f6a62" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- judge -->
  <g transform="translate(624,70)">
    <rect width="200" height="110" rx="8" fill="#1d5f73"/>
    <text x="100" y="26" text-anchor="middle" font-weight="700" fill="#fffdf9">judge</text>
    <text x="100" y="44" text-anchor="middle" font-size="12" fill="#e3eef1">Claude, one structured call</text>
    <text x="14" y="68" font-size="12" fill="#fffdf9">basis: a quote from the lesson</text>
    <text x="14" y="86" font-size="12" fill="#fffdf9">verdict · certainty</text>
    <text x="14" y="104" font-size="12" fill="#fffdf9">note to the learner (streams)</text>
  </g>
  <path d="M824 125 L860 125" stroke="#6f6a62" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- policy -->
  <g transform="translate(862,56)">
    <rect width="200" height="138" rx="8" fill="#fffdf9" stroke="#1d5f73" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-weight="700" fill="#1d5f73">act: the policy, in code</text>
    <text x="14" y="52" font-size="12">✓ guard was clean</text>
    <text x="14" y="70" font-size="12">✓ not pasted from the lesson</text>
    <text x="14" y="88" font-size="12">✓ certainty is high</text>
    <text x="14" y="106" font-size="12">✓ a passage to ground it on</text>
    <text x="14" y="124" font-size="12">✓ note doesn't give it away</text>
  </g>

  <!-- branches below the policy -->
  <path d="M980 194 L980 250" stroke="#2e7d4f" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
  <text x="990" y="228" font-size="12" fill="#2e7d4f">all five</text>
  <path d="M912 194 L912 250" stroke="#8a6116" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#w)"/>
  <text x="840" y="228" text-anchor="end" font-size="12" fill="#8a6116">any one fails</text>

  <g transform="translate(900,252)">
    <rect width="160" height="40" rx="8" fill="#e3f2e8" stroke="#2e7d4f"/>
    <text x="80" y="25" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#2e7d4f">file_grade</text>
  </g>
  <g transform="translate(748,252)">
    <rect width="170" height="40" rx="8" fill="#faf0d7" stroke="#8a6116"/>
    <text x="85" y="25" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8a6116">defer_to_instructor</text>
  </g>

  <!-- guard tripped shortcut -->
  <path d="M278 180 L278 272 L746 272" stroke="#8a6116" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#w)"/>
  <text x="292" y="266" font-size="12" fill="#8a6116">guard tripped: flagged for the instructor, no model call</text>

  <!-- the queue -->
  <path d="M980 292 L980 324" stroke="#2e7d4f" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
  <path d="M833 292 L833 324" stroke="#8a6116" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#w)"/>
  <g transform="translate(748,326)">
    <rect width="312" height="48" rx="8" fill="#fffdf9" stroke="#e4dfd5"/>
    <text x="156" y="20" text-anchor="middle" font-size="13" font-weight="600">the instructor's queue</text>
    <text x="156" y="38" text-anchor="middle" font-size="12" fill="#6f6a62">ready to approve · flagged with the reason</text>
  </g>

  <!-- langsmith -->
  <g transform="translate(40,392)">
    <rect width="690" height="60" rx="8" fill="#e3eef1" stroke="#1d5f73" stroke-dasharray="4 3"/>
    <text x="16" y="26" font-weight="700" fill="#1d5f73">LangSmith</text>
    <text x="110" y="26" font-size="12">every run is a trace: guard → retrieve → judge → act, the passages, the raw JSON, each check, the tool call</text>
    <text x="110" y="46" font-size="12">datasets: core · adversarial · judge calibration · label audit · overrides (every decision made in the queue)</text>
  </g>
  <path d="M748 350 L740 350 L740 392" stroke="#1d5f73" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text x="760" y="440" font-size="12" fill="#6f6a62">src/lib/agent/graph.ts · guard.ts · judge.ts · policy.ts · tools.ts</text>
  <text x="760" y="458" font-size="12" fill="#6f6a62">src/lib/retrieval/bm25.ts · chunk.ts · retrieve.ts</text>
</svg>
